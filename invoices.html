<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Generator - Glow Bliss Beauty Parlour</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="invoices.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="rate_card.js"></script>
</head>
<body>
    <nav class="nav">
        <div class="nav-brand">
            <span style="font-size:1.5rem;font-weight:bold">💰</span>
            <span>Invoices</span>
        </div>
        <a href="index.html" class="nav-book" style="padding:0.5rem 1rem;font-size:0.9rem">← Back Home</a>
    </nav>

    <div class="invoice-container">
        <!-- TAB NAVIGATION -->
        <div class="invoice-tabs">
            <button class="tab-btn active" data-tab="create">Create Invoice</button>
            <button class="tab-btn" data-tab="records">Invoice Records</button>
        </div>

        <!-- CREATE INVOICE TAB -->
        <div class="tab-content active" id="create-tab">
            <h1>Generate Invoice</h1>

            <div class="form-section">
                <h2>Customer Details</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="custName">Customer Name *</label>
                        <input type="text" id="custName" placeholder="Enter customer name" required>
                    </div>
                    <div class="form-group">
                        <label for="custEmail">Email</label>
                        <input type="email" id="custEmail" placeholder="customer@example.com">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="custPhone">Phone Number *</label>
                        <input type="tel" id="custPhone" placeholder="+31612345678" required>
                    </div>
                    <div class="form-group">
                        <label for="invoiceDate">Invoice Date</label>
                        <input type="date" id="invoiceDate">
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2>Services & Items</h2>
                <div id="servicesContainer"></div>
                <button id="addServiceBtn" class="btn-secondary">+ Add Service</button>
            </div>

            <div class="form-section">
                <h2>Payment Details</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="paymentMethod">Payment Method</label>
                        <select id="paymentMethod">
                            <option value="">-- Select --</option>
                            <option value="Cash">Cash</option>
                            <option value="Card">Card</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea id="notes" placeholder="Any special notes..."></textarea>
                    </div>
                </div>
            </div>

            <div class="form-section">
                <h2>Discount (Optional)</h2>
                <div class="form-row">
                    <div class="form-group">
                        <label for="discountType">Discount Type</label>
                        <select id="discountType">
                            <option value="none">No Discount</option>
                            <option value="amount">Fixed Amount (€)</option>
                            <option value="percentage">Percentage (%)</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="discountValue">Discount Value</label>
                        <input type="number" id="discountValue" placeholder="0" min="0" step="0.01">
                    </div>
                </div>
            </div>

            <!-- INVOICE PREVIEW -->
            <div class="form-section">
                <h2>Invoice Preview</h2>
                <div id="invoicePreview" class="invoice-preview"></div>
            </div>

            <div class="form-actions">
                <button id="downloadPdfBtn" class="btn-primary">📄 Download PDF</button>
                <button id="printBtn" class="btn-secondary">🖨️ Print</button>
                <button id="saveInvoiceBtn" class="btn-primary" style="background:linear-gradient(135deg, #667eea 0%, #764ba2 100%)">💾 Save & Generate New</button>
            </div>
        </div>

        <!-- RECORDS TAB -->
        <div class="tab-content" id="records-tab">
            <h1>Invoice Records</h1>

            <div class="form-section">
                <div style="display:flex;gap:1rem;margin-bottom:1.5rem">
                    <button id="exportCsvBtn" class="btn-secondary">📊 Export to CSV</button>
                    <button id="clearAllBtn" class="btn-secondary" style="background:#e74c3c;color:white">🗑️ Clear All Records</button>
                </div>

                <div id="recordsTable" class="records-table"></div>
                <p id="noRecords" style="text-align:center;color:#999;padding:2rem">No invoices yet. Create one to get started!</p>
            </div>
        </div>
    </div>

    <script src="invoices.js"></script>
</body>
</html>
